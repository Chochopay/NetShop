<!DOCTYPE html>

<html lang="ru">
<head>
    <meta charset="UTF-8">

    {% load static %}
    <link rel="stylesheet" href="{% static 'catalog/style.css' %}">

    <title>Вход | NetShop</title>


</head>

<body>

```
    <main class="form-container">

        <h1>Вход в NetShop</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Логин</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >
            </div>

            <button class="button" type="submit">
                Войти
            </button>
        </form>

    </main>
```

</body>
</html>
