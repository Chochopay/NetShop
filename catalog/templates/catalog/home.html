<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    {% load static %}
    <link rel="stylesheet" href="{% static 'catalog/style.css' %}">

    <title>NetShop</title>
</head>

<body>

    <header class="header">
        <h1>NetShop</h1>
    </header>

    <main class="container">
        <h2>Товары</h2>

        <div class="products">
            {% for product in products %}
                <div class="product-card">

                    {% if product.image %}
                        <img
                            src="{{ product.image.url }}"
                            alt="{{ product.name }}"
                            class="product-image"
                        >
                    {% endif %}

                    <h3>{{ product.name }}</h3>

                    <p>{{ product.description }}</p>

                    <p class="price">
                        {{ product.price }} сом
                    </p>

                    <p>
                        Категория: {{ product.category.name }}
                    </p>

                    <p>
                        Автор: {{ product.author.username }}
                    </p>

                </div>
            {% endfor %}
        </div>
    </main>

</body>
</html>
